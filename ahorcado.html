<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juegos">
<meta name="theme-color" content="#14471c">
<title>Ahorcado</title>
<style>
html{background-color:#14471c}
:root{--sw:clamp(24px,7.4vw,44px)}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(ellipse at top,#2f7d3a,#14471c 72%) fixed,#14471c;
  color:#eaf5ea;
  display:flex;flex-direction:column;min-height:100vh;
}
.top{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:9px 14px;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.12);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
a.btn{text-decoration:none}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.4px}
.brand .mark{font-size:22px}
.stats{display:flex;gap:9px;font-variant-numeric:tabular-nums}
.stat{background:rgba(0,0,0,.3);padding:4px 11px;border-radius:8px;min-width:66px;text-align:center}
.stat span{display:block;font-size:9.5px;opacity:.72;text-transform:uppercase;letter-spacing:.7px}
.stat b{font-size:15px;font-weight:650}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{
  font:inherit;font-size:13px;background:#37474f;color:#fff;border:1px solid rgba(255,255,255,.22);
  padding:7px 12px;border-radius:8px;cursor:pointer;
}
.btn:hover{background:#455a64}
.btn:active{transform:translateY(1px)}
select.btn{background:#263238;padding:7px 8px}

/* ---------- estado ---------- */
.statusbar{display:flex;justify-content:center;padding:8px 14px 0}
.pill{
  display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.14);padding:5px 16px;border-radius:999px;
  font-size:14px;font-weight:650;box-shadow:0 4px 14px rgba(0,0,0,.25);
  font-variant-numeric:tabular-nums;
}
.dot{width:11px;height:11px;border-radius:50%;background:#90a4ae;box-shadow:0 0 7px currentColor;flex:none}
.dot.g{background:#43a047;color:#43a047}
.dot.r{background:#e53935;color:#e53935}
.dot.y{background:#fdd835;color:#fdd835}
.dot.n{background:#90a4ae;color:#90a4ae}

/* ---------- tablero ---------- */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px;min-height:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,14px);width:100%}
.board{
  width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;
  gap:clamp(8px,1.6vh,16px);padding:clamp(8px,1.6vw,14px);
  background:linear-gradient(180deg,#17512a,#0d3a1e);
  border-radius:clamp(8px,1.4vw,16px);
  box-shadow:0 20px 55px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.35);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.board.bad{animation:shake .42s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}
}

/* ---------- ahorcado SVG (decisión: tiza monocroma sobre pizarra oscura;
   el repo es verde oscuro: la pizarra contrasta y no necesita assets) ---------- */
.hang{
  width:100%;display:flex;justify-content:center;align-items:center;padding:8px 10px;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px),linear-gradient(180deg,#22333d,#16242c);
  background-size:9px 9px,auto;
  border:1px solid rgba(255,255,255,.14);border-radius:10px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.1),inset 0 -3px 12px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.4);
}
.hang svg{width:min(64vw,210px);height:auto;display:block}
.gh{fill:none;stroke:rgba(255,255,255,.1);stroke-width:4.5;stroke-linecap:round}
.ln{
  fill:none;stroke:#eef6ee;stroke-width:4.5;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 2px rgba(255,255,255,.25));
}
.ln.on{stroke-dashoffset:0;animation:draw .55s ease both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ln.on{animation:none}}

/* ---------- palabra oculta ---------- */
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(4px,1.4vw,9px);padding:2px 0}
.slot{
  width:var(--sw);height:calc(var(--sw)*1.2);display:grid;place-items:center;
  background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.16);
  border-bottom:3px solid rgba(255,255,255,.5);border-radius:6px 6px 3px 3px;
  font-size:calc(var(--sw)*.62);font-weight:750;text-transform:uppercase;color:#9ccc65;
}
.slot.hid{color:rgba(255,255,255,.3);border-bottom-color:rgba(255,255,255,.4)}

/* ---------- teclado en pantalla ---------- */
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px;padding:0 6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{
  position:relative;
  flex:1;min-width:0;height:clamp(42px,7vh,58px);
  font:inherit;font-size:clamp(12px,2.8vw,15px);font-weight:650;
  background:#565758;color:#fff;border:1px solid rgba(255,255,255,.18);
  border-radius:6px;cursor:pointer;padding:0;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
.key:not(.used):hover{background:#6b6c6e}
.key:active{transform:translateY(1px)}
/* letras usadas: atenuadas con su estado ✓/✗ */
.key.used{opacity:.62;cursor:default}
.key.ok{background:#2f6f36;border-color:#3f8a46;color:#d9f0da;opacity:.78}
.key.no{background:#33404a;border-color:#33404a;color:#93a3ad;opacity:.58}
.key.ok::after,.key.no::after{position:absolute;top:2px;right:4px;font-size:9px;line-height:1}
.key.ok::after{content:"✓";color:#a5d6a7}
.key.no::after{content:"✗";color:#ef9a9a}

/* ---------- ayuda / overlays ---------- */
.hint-bar{padding:0 14px 8px;font-size:12px;opacity:.6;text-align:center}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);
  background:rgba(0,0,0,.88);border:1px solid rgba(255,255,255,.15);
  padding:9px 17px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:60;
}
#toast.show{opacity:1;transform:translateX(-50%)}
#win{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;z-index:70}
#win.show{display:grid}
.winbox{
  background:#17351b;border:1px solid rgba(255,255,255,.2);border-radius:14px;
  padding:24px 30px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);
  max-width:90vw;max-height:92vh;overflow:auto;
}
.winbox h2{margin:0 0 6px;font-size:26px}
.winbox .winword{font-size:21px;font-weight:750;letter-spacing:4px;margin:8px 0;color:#9ccc65}
.winbox p{margin:10px 0 12px;opacity:.85;font-variant-numeric:tabular-nums;font-size:14px}
.winbox h3{margin:4px 0 8px;font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.8px}
.dist{display:flex;flex-direction:column;gap:5px;margin:0 0 18px;text-align:left}
.drow{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.drow span{width:16px;opacity:.75}
.drow .bar{flex:1;height:16px;background:rgba(255,255,255,.09);border-radius:4px;overflow:hidden}
.drow .bar i{display:block;height:100%;background:#538d4e}
.drow.hit .bar i{background:#b59f3b}
.drow b{width:26px;text-align:right}

@media (max-width:760px){
  .top{gap:7px;padding:8px 10px}
  .brand h1{font-size:15px}
  .stat{min-width:56px;padding:3px 8px}
  .board-wrap{padding:7px}
  .hint-bar{padding:0 10px 7px}
  .statusbar{padding-top:7px}
}
@media (max-width:600px){
  .stats{gap:6px}
  .stat{min-width:50px;padding:3px 7px}
  .stat b{font-size:13.5px}
  .btn{font-size:12.5px;padding:6px 10px}
  .pill{font-size:13px;padding:4px 12px}
}
/* app nativa apple: safe areas (notch/status bar/home indicator) */
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
@supports(padding:env(safe-area-inset-top)){
  body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
  .top{top:env(safe-area-inset-top)}
}
</style>
</head>
<body>

  <a class="brand" href="index.html" title="Lista de juegos"><span class="mark">☠️</span><h1>Ahorcado</h1></a>

            <path d="M18 214H120"/><path d="M46 214V26"/>

<script>
/* =========================================================================
   AHORCADO — motor puro (sin IIFE, sin 'use strict', sin document/window/
   localStorage/setTimeout; RNG inyectable en newGame(len,rnd)).

   REGLAS (convención de los hangman móviles top):
      - 7 errores = pierdes (LIVES=7). Adivinar todas las letras = ganas.
      - Letras repetidas no cuentan; mayúsculas y minúsculas son la misma
        letra. Las letras se juegan directo (teclado en pantalla o físico);
        no hay casilla de texto ni Enter.

   AHORCADO SVG (decisión documentada):
      - SVG inline monocromo, trazo tipo tiza (#eef6ee) sobre panel pizarra
        oscura (el repo es verde oscuro: la pizarra contrasta y no necesita
        ningún asset externo). Contorno fantasma (opacidad .1) del dibujo
        completo como pista de la silueta final.
      - Trazo progresivo con pathLength="1" + stroke-dashoffset y una etapa
        por clase .s1..s7 (7 etapas = 7 errores):
          s1 base y poste (juntos, para que las etapas casen con los 7
             fallos), s2 viga (con tirante), s3 cuerda, s4 cabeza,
          s5 cuerpo, s6 brazos, s7 piernas.
        Cada acierto erróneo añade .on a su etapa → animación de dibujado.

   LISTAS (decisión documentada):
      - Tres listas embebidas 4/5/6 letras (≥80 cada una), solo A-Z, sin
        tilde y sin Ñ: así TODA palabra se teclea con el teclado físico.
      - El teclado en pantalla sí incluye Ñ (distribución española
        estándar). Al no haber ninguna palabra con Ñ, pulsar Ñ es siempre
        un fallo normal: consistente y sin tildes que olvidar.

   TECLA N (equivalente a la "casilla vacía" de palabra.html, que aquí no
   existe): nIsNew() inicia partida nueva cuando la N no puede aportar —
   tablero intacto, N ya probada o partida terminada —; en cualquier otro
   caso N se juega como letra.

   DIFICULTAD: localStorage 'ah.diff' guarda la longitud (4|5|6).
   ESTADÍSTICAS: localStorage 'ah.stats.<lon>' guarda
     {p:partidas, w:ganadas, racha actual s, mejor racha b, d:[0..6]}
     donde d[k] cuenta las victorias logradas usando k fallos (0–6).

   API del motor (evaluable en Node):
      WORDS={4:[],5:[],6:[]}
      LIVES                       -> 7
      newGame(len,rnd)            -> {len, word, guessed:[], wrong:0,
                                      done:false, result:null}
      guess(letter,st)            -> estado NUEVO (nunca muta st; repetida
                                     o inválida = no-op)
      revealed(st)                -> 'C_A_' con guiones bajos por letra
                                     oculta
      isWon(st) / isLost(st)      -> booleanos
      keyState(letter,st)         -> '' | 'ok' | 'no'  (para el teclado)
      nIsNew(st)                  -> true si N inicia partida nueva
      state                       -> estado global (lo usa la interfaz)
   ========================================================================= */

var WORDS={
4:['ALTO','AMOR','AZUL','ARMA','ALMA','ARTE','ALTA','ABRE','ALBA',
   'BOCA','BODA','BOLA','BATA','BAJO','BESO','BIEN',
   'CASA','CAMA','COLA','COPA','CARA','CINE','CITA','CIEN','COCO','COMO','CREO',
   'DATO','DAMA','DEJO','DOCE','DURO','DIOS',
   'ESTE','EDAD',
   'FARO','FASE','FILA','FINO','FLOR',
   'GATO','GANA','GIRA','GOMA','GOTA','GRIS','GIRO',
   'HILO','HOJA','HORA','HIJO','HAYA','HUMO',
   'ISLA','IDEA',
   'JEFE','JOTA','JADE','JACA',
   'LADO','LANA','LATA','LAVA','LEAL','LOBO','LOCO','LOMA','LUNA','LORO','LINO','LILA',
   'MALO','MANO','MASA','MESA','META','MINA','MODA','MONO','MURO','MORA','MULO','MICO',
   'OJOS','OLLA','OSOS','ONCE','OBRA','ORBE',
   'PALO','PATA','POCO','PARA','PENA','PESO','PISO','POLO','PICA','PURO','PICO',
   'RANA','RATO','RAMA','ROCA','ROJO','ROSA','RISA','RUTA','RICO','RIEL',
   'SACO','SALA','SAPO','SILO','SEDE','SIEN','SINO','SOPA','SETA','SECO','SANO',
   'TACO','TALA','TAZA','TELA','TIPO','TIRO','TOMA','TORO','TRES','TUNA',
   'URBE','URGE','USAR',
   'VACA','VASO','VELA','VINO','VIRA','VIVO',
   'YATE','YODO',
   'ZONA','ZUMO'],
5:['ABRIR','AGUAS','AHORA','ALDEA','ALTAR','AMIGO','ANDAR','ARENA','AZOTE',
   'BACHE','BAILE','BANDA','BARCO','BATIR','BEBER','BREVE','BURRO',
   'CABLE','CALMA','CALOR','CALDO','CAMPO','CANOA','CANTO','CAPAZ','CARTA','CASTO','CAUSA','CERDO','CHICO','CIELO','CLARO','COLOR',
   'DARDO','DELTA','DISCO','DONDE','DUDAR','DUQUE',
   'ENERO','ERROR','EXTRA',
   'FALDA','FALSO','FALTA','FATAL','FERIA','FICHA','FINAL','FORMA','FRUTA','FUEGO','FUMAR','FLOTA',
   'GAFAS','GANSO','GLOBO','GORRA','GRANO','GRAVE','GRUPO','GUAPO','GENTE',
   'HACER','HABER','HASTA','HOTEL',
   'IGUAL',
   'JUSTO',
   'LARGO','LECHE','LETRA','LINDO','LIBRO','LLAVE','LUGAR','LUNES','LUCHA',
   'MADRE','MAGIA','MARCO','MAREA','MENOS','MARZO','MIRAR','MUNDO','MUSLO','METER',
   'PADRE','PALMA','PANAL','PAPEL','PATIO','PEDIR','PEINE','PIANO','PINTA','PLATA','PLATO','PODER','POLVO','PONER','POEMA','PRADO','PUNTO',
   'QUESO','QUIEN',
   'RADAR','RANGO','RELOJ','RITMO','ROLLO','RUEDA','RUIDO',
   'SABER','SALTO','SANTO','SAUCE','SECAR','SERIO','SITIO','SORDO','SUELO',
   'TABLA','TALLO','TANTO','TARDE','TARTA','TECHO','TEXTO','TIGRE','TOCAR','TRIGO','TURCO','TURNO','TOMAR',
   'ULTRA',
   'VALOR','VERDE','VERSO','VICIO','VIDEO','VISTO','VALLE',
   'YOGUR',
   'ZORRO'],
6:['ACEITE','ABUELO','ABRIGO','AGOSTO','ACABAR','ALEGRE',
   'BALLET','BARATO','BARRIO','BORRAR','BUSCAR',
   'CALLAR','CAMBIO','CAMINO','CANSAR','CAPOTE','CARTEL','CASTOR','CHISTE','CONTRA','CORRER','CORREO','CRIMEN','CUESTA',
   'DANZAR','DEBATE','DENTRO','DORMIR',
   'EDITAR','ELEGIR','ENTRAR','ENREDO','EQUIPO',
   'ESCALA','ESCOBA','ESPERA',
   'FILTRO','FINGIR','FORZAR','FRESCO','FUERTE',
   'GASTAR','GRITAR',
   'HELADO','HAMBRE','HOMBRE','HIERBA','HUERTO',
   'JIRAFA','JORNAL','JUNTAR',
   'KIOSCO',
   'LLENAR','LIMPIO','LUCHAR','LLOVER',
   'MALETA','MANDAR','MONEDA','MUELLE',
   'OFICIO','OLIVAR','ORILLA',
   'PAGANO','PENSAR','PINTAR','PLANTA','PUERTA','QUITAR','QUERER',
   'RASTRO',
   'SALTAR','SEMANA','SENTAR','SOMBRA','SONIDO','SOPLAR','SUFRIR',
   'TALLAR','TEATRO','TIEMPO','TOMATE','TORCER',
   'VENCER','VERANO','VIENTO','VOLVER','VENDER',
   'BAILAR','ACUDIR']
};
var LIVES=7;

function normalizeLen(len){
  len=Math.floor(Number(len));
  return (len===4||len===5||len===6)?len:5;
}

/* Una sola letra normalizada: A-Z o Ñ en mayúscula; '' si no lo es. */
function normLetter(letter){
  if(letter===undefined||letter===null) return '';
  var ch=String(letter).toUpperCase();
  return (ch.length===1&&/^[A-ZÑ]$/.test(ch))?ch:'';
}

/* Partida nueva. rnd: función ()->[0,1) inyectable (por defecto Math.random). */
function newGame(len,rnd){
  len=normalizeLen(len);
  if(typeof rnd!=='function') rnd=Math.random;
  var list=WORDS[len];
  var word=list[Math.floor(rnd()*list.length)];
  return {len:len,word:word,guessed:[],wrong:0,done:false,result:null};
}

/* Patrón visible: letra adivinada en su sitio, '_' donde falta. */
function revealed(st){
  if(!st) return '';
  var out='',i;
  for(i=0;i<st.word.length;i++){
    out+=(st.guessed.indexOf(st.word[i])>=0)?st.word[i]:'_';
  }
  return out;
}

/* Tiro: devuelve SIEMPRE un estado nuevo (st intacta). Repetida, inválida
   o partida terminada = no-op. Suma fallo solo si la letra no está. */
function guess(letter,st){
  if(!st) return null;
  var next={
    len:st.len,word:st.word,guessed:st.guessed.slice(),
    wrong:st.wrong,done:st.done,result:st.result
  };
  if(next.done) return next;
  var ch=normLetter(letter);
  if(!ch) return next;
  if(next.guessed.indexOf(ch)>=0) return next;
  next.guessed.push(ch);
  if(next.word.indexOf(ch)<0){
    next.wrong++;
    if(next.wrong>=LIVES){ next.done=true; next.result='lose'; return next; }
  }
  if(revealed(next)===next.word){ next.done=true; next.result='win'; }
  return next;
}

function isWon(st){ return !!(st&&st.done&&st.result==='win'); }
function isLost(st){ return !!(st&&st.done&&st.result==='lose'); }

/* Estado de una tecla para el teclado: probada y acertada / fallada. */
function keyState(letter,st){
  if(!st) return '';
  var ch=normLetter(letter);
  if(!ch||st.guessed.indexOf(ch)<0) return '';
  return (st.word.indexOf(ch)>=0)?'ok':'no';
}

/* ¿La tecla N inicia partida nueva? (ver nota de regla N arriba) */
function nIsNew(st){
  if(!st) return true;
  if(st.done) return true;
  if(st.guessed.indexOf('N')>=0) return true;
  return st.guessed.length===0;
}

/* Estado global (lo usa la interfaz). */
var state=newGame(5);

/* =========================================================================
   INTERFAZ — solo en navegador. localStorage guardado dentro de este bloque.
   ========================================================================= */
if (typeof document !== 'undefined') {
  var $=function(s){return document.querySelector(s);};

  var DIFF_NAMES={4:'4 letras · Fácil',5:'5 letras · Normal',6:'6 letras · Experto'};
  var KB=[
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L','Ñ'],
    ['Z','X','C','V','B','N','M']
  ];

  var len=5, toastTimer=null, endTimer=null;
  var stats={p:0,w:0,s:0,b:0,d:[0,0,0,0,0,0,0]};

  /* ---------- almacenamiento (siempre con guarda) ---------- */
  function loadDiff(){
    try{
      if(typeof localStorage!=='undefined'){
        var v=parseInt(localStorage.getItem('ah.diff')||'5',10);
        if(v===4||v===5||v===6) return v;
      }
    }catch(e){}
    return 5;
  }
  function saveDiff(){
    try{
      if(typeof localStorage!=='undefined') localStorage.setItem('ah.diff',String(len));
    }catch(e){}
  }
  function loadStats(){
    stats={p:0,w:0,s:0,b:0,d:[0,0,0,0,0,0,0]};
    try{
      if(typeof localStorage!=='undefined'){
        var raw=localStorage.getItem('ah.stats.'+len);
        if(raw){
          var o=JSON.parse(raw);
          if(o&&typeof o==='object'){
            stats.p=+o.p||0; stats.w=+o.w||0; stats.s=+o.s||0; stats.b=+o.b||0;
            if(Object.prototype.toString.call(o.d)==='[object Array]'&&o.d.length===7){
              for(var i=0;i<7;i++) stats.d[i]=+o.d[i]||0;
            }
          }
        }
      }
    }catch(e){}
  }
  function saveStats(){
    try{
      if(typeof localStorage!=='undefined'){
        localStorage.setItem('ah.stats.'+len,JSON.stringify(stats));
      }
    }catch(e){}
  }

  /* ---------- util ---------- */
  function toast(msg){
    var t=$('#toast');
    t.textContent=msg;
    t.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.classList.remove('show'); },2200);
  }

  /* ---------- pintura ---------- */
  function paintStats(){
    $('#statP').textContent=String(stats.p);
    $('#statW').textContent=String(stats.w);
    $('#statS').textContent=String(stats.s);
  }
  function paintStatus(){
    var txt,dot;
    if(isWon(state)){ txt='¡Ganaste con '+state.wrong+' fallo'+(state.wrong===1?'':'s')+'!'; dot='g'; }
    else if(isLost(state)){ txt='Cuelgas · era '+state.word; dot='r'; }
    else {
      txt='Errores '+state.wrong+' de '+LIVES+' · quedan '+(LIVES-state.wrong);
      dot=(state.wrong===0)?'n':(state.wrong<=3?'y':'r');
    }
    $('#status').textContent=txt;
    $('#stDot').className='dot '+dot;
  }
  function paintFigure(){
    for(var k=1;k<=LIVES;k++){
      var els=document.querySelectorAll('#hg .s'+k);
      for(var i=0;i<els.length;i++){
        if(state.wrong>=k) els[i].classList.add('on');
        else els[i].classList.remove('on');
      }
    }
  }
  function paintWord(){
    var pat=revealed(state),html='',i;
    for(i=0;i<pat.length;i++){
      var hid=(pat[i]==='_');
      html+='<span class="slot'+(hid?' hid':'')+'">'+(hid?'_':pat[i])+'</span>';
    }
    $('#word').innerHTML=html;
  }
  function paintKeys(){
    var els=document.querySelectorAll('#kb .key'),i;
    for(i=0;i<els.length;i++){
      var ks=keyState(els[i].getAttribute('data-k'),state);
      els[i].classList.toggle('used',!!ks);
      els[i].classList.toggle('ok',ks==='ok');
      els[i].classList.toggle('no',ks==='no');
    }
  }
  function buildKb(){
    var k=$('#kb');
    k.innerHTML='';
    for(var r=0;r<KB.length;r++){
      var row=document.createElement('div');
      row.className='krow';
      for(var c=0;c<KB[r].length;c++){
        var ch=KB[r][c];
        var btn=document.createElement('button');
        btn.type='button';
        btn.className='key';
        btn.setAttribute('data-k',ch);
        btn.textContent=ch;
        row.appendChild(btn);
      }
      k.appendChild(row);
    }
  }
  function shake(){
    var b=$('#board');
    b.classList.remove('bad');
    void b.offsetWidth;
    b.classList.add('bad');
    setTimeout(function(){ b.classList.remove('bad'); },450);
  }

  /* ---------- entrada ---------- */
  function play(ch){
    if(state.done) return;
    if(keyState(ch,state)){ toast('Ya probaste la '+ch); return; }
    var was=state.wrong;
    state=guess(ch,state);
    paintWord(); paintKeys(); paintStatus();
    if(state.wrong>was){ shake(); paintFigure(); }
    if(state.done){
      if(endTimer) clearTimeout(endTimer);
      endTimer=setTimeout(function(){
        endTimer=null;
        finish();
      }, state.result==='lose'?750:450);
    }
  }

  /* ---------- fin de partida + estadísticas ---------- */
  function finish(){
    if(!state.done) return;
    var win=isWon(state);
    stats.p++;
    if(win){
      stats.w++;
      stats.s++;
      if(stats.s>stats.b) stats.b=stats.s;
      stats.d[state.wrong]++;          /* victorias por nº de fallos (0–6) */
    }else{
      stats.s=0;
    }
    saveStats();
    paintStats();
    paintStatus();
    var pct=stats.p?Math.round(stats.w*100/stats.p):0;
    $('#winTitle').textContent=win?'¡Ganaste!':'Te ahorcaron';
    $('#winWord').textContent=state.word;
    $('#winStats').textContent='Partidas '+stats.p+' · Ganadas '+stats.w+' ('+pct+
      '%) · Racha '+stats.s+' · Mejor '+stats.b;
    paintDist();
    $('#win').classList.add('show');
    toast(win?('¡Palabra completa con '+state.wrong+' fallo'+(state.wrong===1?'':'s')+'!'):
      ('Era '+state.word));
  }
  function paintDist(){
    var d=stats.d,max=1,i;
    for(i=0;i<7;i++) if(d[i]>max) max=d[i];
    var box=$('#winDist');
    box.innerHTML='';
    var hit=(state.result==='win')?state.wrong:-1;
    for(i=0;i<7;i++){
      var row=document.createElement('div');
      row.className='drow'+(hit===i?' hit':'');
      var bar=document.createElement('div');
      bar.className='bar';
      var fill=document.createElement('i');
      fill.style.width=Math.round(d[i]*100/max)+'%';
      bar.appendChild(fill);
      var num=document.createElement('span');
      num.textContent=String(i);
      var cnt=document.createElement('b');
      cnt.textContent=String(d[i]);
      row.appendChild(num); row.appendChild(bar); row.appendChild(cnt);
      box.appendChild(row);
    }
  }

  /* ---------- partida nueva ---------- */
  function startNew(silent){
    if(endTimer){ clearTimeout(endTimer); endTimer=null; }
    $('#win').classList.remove('show');
    state=newGame(len);
    paintFigure(); paintWord(); paintKeys(); paintStatus();
    if(!silent) toast('Nueva palabra · '+DIFF_NAMES[len]);
  }

  /* ---------- eventos ---------- */
  $('#btnNew').addEventListener('click',function(){ startNew(false); });
  $('#btnAgain').addEventListener('click',function(){ startNew(false); });
  $('#diffSel').addEventListener('change',function(e){
    var v=parseInt(e.target.value,10);
    if(v!==4&&v!==5&&v!==6) v=5;
    len=v;
    saveDiff();
    loadStats();
    startNew(true);
    toast('Dificultad: '+DIFF_NAMES[len]);
  });

  /* Teclado en pantalla: las letras se juegan al tocar */
  $('#kb').addEventListener('click',function(e){
    var el=e.target&&e.target.closest?e.target.closest('[data-k]'):null;
    if(!el) return;
    if(el.blur) el.blur();           /* el foco no debe comer el teclado físico */
    play(el.getAttribute('data-k'));
  });

  /* Teclado físico: letras directas (con Ñ). N = nueva partida según nIsNew.
     Enter y ESPACIO no hacen nada: no hay casilla que enviar. */
  document.addEventListener('keydown',function(e){
    if(e.target&&(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='n'||e.key==='N'){
      e.preventDefault();
      if(nIsNew(state)) startNew(false);
      else play('N');
      return;
    }
    if(e.key&&e.key.length===1){
      var ch=e.key.toUpperCase();
      if(/^[A-ZÑ]$/.test(ch)){ e.preventDefault(); play(ch); }
    }
  });

  /* ---------- arranque ---------- */
  len=loadDiff();
  $('#diffSel').value=String(len);
  loadStats();
  buildKb();
  state=newGame(len);
  paintStats();
  paintFigure();
  paintWord();
  paintKeys();
  paintStatus();
}

/* =========================================================================
   TESTS — solo en Node (fuera del navegador nunca se ejecutan).
   ========================================================================= */
var runTests=function(){
  var t=0,f=0,groups=[],cur=null;
  function js(v){ try{return JSON.stringify(v);}catch(e){return String(v);} }
  function group(name){ cur={n:name,t:0,f:0}; groups.push(cur); }
  function ok(c,m){
    t++;
    if(cur) cur.t++;
    if(!c){ f++; if(cur) cur.f++; console.log('FAIL ['+(cur?cur.n:'?')+'] '+m); }
  }
  function eq(a,b,m){ ok(a===b,m+' | esperado '+js(b)+', obtenido '+js(a)); }
  function rng(seed){
    var a=seed>>>0;
    return function(){
      a=(a+0x6D2B79F5)|0;
      var x=Math.imul(a^(a>>>15),1|a);
      x=(x+Math.imul(x^(x>>>7),61|x))^x;
      return ((x^(x>>>14))>>>0)/4294967296;
    };
  }
  function fresh(w){ return {len:w.length,word:w,guessed:[],wrong:0,done:false,result:null}; }

  /* ---------- listas ---------- */
  group('listas embebidas');
  ok(WORDS&&WORDS[4]&&WORDS[5]&&WORDS[6],'WORDS expuesto con 4,5,6');
  var LENS=[4,5,6],li,i;
  for(li=0;li<3;li++){
    var L=LENS[li],arr=WORDS[L];
    ok(Object.prototype.toString.call(arr)==='[object Array]','WORDS['+L+'] es array');
    ok(arr.length>=80,'WORDS['+L+'] con ≥80 palabras (hay '+arr.length+')');
    var badLen=0,badCh=0;
    for(i=0;i<arr.length;i++){
      if(typeof arr[i]!=='string'||arr[i].length!==L) badLen++;
      if(!/^[A-Z]+$/.test(arr[i])) badCh++;
    }
    eq(badLen,0,'WORDS['+L+'] todas con longitud '+L);
    eq(badCh,0,'WORDS['+L+'] solo A-Z (sin Ñ ni tildes)');
    var seen={},dup=0;
    for(i=0;i<arr.length;i++){ if(seen[arr[i]]) dup++; seen[arr[i]]=1; }
    eq(dup,0,'WORDS['+L+'] sin repetidas');
  }

  /* ---------- API ---------- */
  group('API del motor');
  eq(LIVES,7,'LIVES=7');
  eq(typeof newGame,'function','newGame es función');
  eq(typeof guess,'function','guess es función');
  eq(typeof revealed,'function','revealed es función');
  eq(typeof isWon,'function','isWon es función');
  eq(typeof isLost,'function','isLost es función');
  ok(state&&typeof state==='object','var state existe y es objeto');
  ok(WORDS[state.len].indexOf(state.word)>=0,'state.word pertenece a su lista');

  /* ---------- newGame ---------- */
  group('newGame coherente');
  eq(newGame(4).len,4,'newGame(4).len=4');
  eq(newGame(5).len,5,'newGame(5).len=5');
  eq(newGame(6).len,6,'newGame(6).len=6');
  eq(newGame('6').len,6,"newGame('6') acepta string");
  eq(newGame(9).len,5,'longitud inválida → 5');
  eq(newGame().len,5,'sin argumento → 5');
  eq(newGame(4,function(){return 0;}).word,WORDS[4][0],'rnd=0 → primera palabra');
  eq(newGame(6,function(){return 0.999999;}).word,WORDS[6][WORDS[6].length-1],'rnd≈1 → última palabra');
  var gg=newGame(5);
  eq(gg.word.length,5,'newGame(5) palabra de 5 letras');
  eq(gg.guessed.length,0,'empieza sin letras');
  eq(gg.wrong,0,'empieza con 0 fallos');
  eq(gg.done,false,'empieza sin terminar');
  eq(gg.result,null,'empieza sin resultado');
  for(i=0;i<20;i++){
    var r=rng(i+11),g=newGame(LENS[i%3],r);
    ok(WORDS[g.len].indexOf(g.word)>=0&&g.guessed.length===0&&g.wrong===0&&!g.done&&g.result===null,
      'newGame('+g.len+') con rnd inyectado número '+i+' coherente');
  }

  /* ---------- guess ---------- */
  group('guess');
  var fx=fresh('CASA');
  var n=guess('C',fx);
  ok(n!==fx,'guess devuelve objeto nuevo');
  eq(fx.guessed.length,0,'estado original intacto');
  eq(fx.wrong,0,'estado original intacto (wrong)');
  eq(n.guessed.join(''),'C','acierto añade la letra');
  eq(n.wrong,0,'acierto no suma fallo');
  eq(revealed(n),'C___','acierto revela en su sitio');
  eq(guess('Z',fresh('CASA')).wrong,1,'fallo suma 1 error');
  var s1=guess('C',fresh('CASA'));
  var s2=guess('C',s1);
  eq(s2.guessed.length,1,'repetida no cuenta');
  eq(s2.wrong,0,'repetida no cambia fallos');
  var s3=guess('c',fresh('CASA'));
  eq(s3.guessed.join(''),'C','minúscula = mayúscula');
  eq(guess('a',s3).guessed.join(''),'CA','minúscula acierta tras mayúscula');
  eq(guess('',fresh('CASA')).wrong,0,'cadena vacía = no-op');
  eq(guess('1',fresh('CASA')).wrong,0,'carácter no letra = no-op');
  eq(guess('AB',fresh('CASA')).wrong,0,'dos letras = no-op');
  eq(guess('Z',null),null,'sin estado = null');
  var fn=fresh('CASA'),kn;
  for(kn=0;kn<6;kn++) fn=guess('ZYXWVU'[kn],fn);
  eq(fn.wrong,6,'6 fallos');
  eq(fn.done,false,'6 errores aún vive');
  eq(fn.result,null,'sin resultado con 6 errores');
  ok(!isWon(fn)&&!isLost(fn),'ni ganada ni perdida con 6 errores');
  fn=guess('T',fn);
  eq(fn.wrong,7,'7º fallo');
  eq(fn.done,true,'7 errores termina');
  eq(fn.result,'lose','7 errores = lose');
  ok(isLost(fn),'isLost cierto');
  var after=guess('Q',fn);
  eq(after.guessed.length,7,'tras perder los tiros son no-op');
  eq(after.wrong,7,'tras perder no suma fallos');
  var w=fresh('CASA');
  w=guess('C',w); w=guess('A',w); w=guess('S',w);
  eq(w.done,true,'palabra completa termina');
  eq(w.result,'win','palabra completa = win');
  ok(isWon(w),'isWon cierto');
  eq(revealed(w),'CASA','palabra completa revelada');
  eq(w.wrong,0,'victoria sin fallos');
  eq(w.guessed.length,3,'guessed sin duplicados (C,A,S)');
  eq(w.guessed.length,(new Set(w.guessed)).size,'guessed sin repetidas (Set)');
  var mix=fresh('RANA'),j;
  for(j=0;j<10;j++) mix=guess('RANBQZXY'[j%8],mix);
  eq(mix.guessed.length,(new Set(mix.guessed)).size,'mezcla de repetidas y case: sin duplicados');
  var acc=fresh('CASA');
  var acc2=guess('ñ',acc);
  eq(acc2.wrong,1,'Ñ (no está en las listas) cuenta como fallo');
  eq(acc2.guessed.join(''),'Ñ','Ñ normalizada a mayúscula');
  ok(!isWon(acc2)&&!isLost(acc2),'Ñ no termina la partida');

  /* ---------- revealed ---------- */
  group('revealed con fixtures');
  eq(revealed(fresh('CASA')),'____','nada adivinado = guiones');
  eq(revealed(fresh('PERRO')),'_____','5 letras ocultas');
  var rv=fresh('CASA'); rv=guess('A',rv);
  eq(revealed(rv),'_A_A','letra repetida en la palabra se revela en todas sus casillas');
  var rv2=fresh('TIGRE'); rv2=guess('G',rv2);
  eq(revealed(rv2),'__G__','guiones a izquierda y derecha');
  var rv3=fresh('ALTO');
  rv3=guess('A',rv3); rv3=guess('L',rv3); rv3=guess('T',rv3);
  eq(revealed(rv3),'ALT_','tres de cuatro');
  eq(revealed(null),'','revealed(null) = vacío');

  /* ---------- estados y teclas ---------- */
  group('estados, teclado y tecla N');
  ok(!isWon(fresh('CASA'))&&!isLost(fresh('CASA')),'recién creada: ni win ni lose');
  eq(keyState('C',fresh('CASA')),'','tecla sin probar = vacío');
  var kt=fresh('CASA'); kt=guess('C',kt);
  eq(keyState('C',kt),'ok','tecla acertada = ok');
  eq(keyState('c',kt),'ok','keyState ignora mayúsculas');
  eq(keyState('Z',guess('Z',fresh('CASA'))),'no','tecla fallada = no');
  ok(nIsNew(fresh('CASA')),'tablero intacto → N nueva partida');
  ok(nIsNew(null),'state nulo → N nueva partida');
  var nf=fresh('CASA'); nf=guess('C',nf);
  ok(!nIsNew(nf),'con letras adivinadas y sin N → N se juega');
  var nn=fresh('CASA'); nn=guess('N',nn);
  ok(nIsNew(nn),'N ya probada → N nueva partida');
  var nd=fresh('CASA'); nd=guess('Z',nd); nd=guess('Y',nd); nd=guess('X',nd);
  nd=guess('W',nd); nd=guess('V',nd); nd=guess('U',nd); nd=guess('T',nd);
  ok(nd.done&&nIsNew(nd),'partida terminada → N nueva partida');

  /* ---------- 10 partidas simuladas con rnd inyectado ---------- */
  group('simulación de 10 partidas');
  var wins=0,losses=0;
  var shuffle=function(a,r){
    for(var x=a.length-1;x>0;x--){ var y=Math.floor(r()*(x+1)),z=a[x]; a[x]=a[y]; a[y]=z; }
    return a;
  };
  for(i=0;i<10;i++){
    var r2=rng(9001+i*137),L2=LENS[i%3],st=newGame(L2,r2);
    ok(WORDS[L2].indexOf(st.word)>=0,'partida '+i+': palabra de '+L2+' letras de la lista');
    /* Dos estrategias con el mismo rnd inyectado:
       i<5 → "guiada" (primero las letras de la palabra, barajadas): victoria esperada.
       i≥5 → aleatoria (barajado completo): suele colgar. */
    var j2,letr=st.word.split('');
    var wlet=[];
    for(j2=0;j2<letr.length;j2++){ if(wlet.indexOf(letr[j2])<0) wlet.push(letr[j2]); }
    var rest='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    var rest2=[];
    for(j2=0;j2<rest.length;j2++) if(wlet.indexOf(rest[j2])<0) rest2.push(rest[j2]);
    var pool;
    if(i<5){ pool=shuffle(wlet.slice(),r2).concat(shuffle(rest2,r2)); }
    else{ pool=shuffle(wlet.concat(rest2),r2); }
    var plays=0,prev=st;
    while(!st.done&&plays<pool.length){
      prev=st;
      st=guess(pool[plays],st);
      ok(st!==prev,'partida '+i+': jugada '+plays+' devuelve estado nuevo');
      plays++;
    }
    ok(st.done,'partida '+i+': termina');
    eq(st.guessed.length,plays,'partida '+i+': guessed sin duplicados');
    eq(st.guessed.length,(new Set(st.guessed)).size,'partida '+i+': Set coincide');
    if(st.result==='win'){
      wins++;
      ok(isWon(st),'partida '+i+': isWon');
      eq(revealed(st),st.word,'partida '+i+': victoria con palabra revelada');
      ok(st.wrong<LIVES,'partida '+i+': victoria con menos de 7 fallos');
      var all=true;
      for(j2=0;j2<st.word.length;j2++) if(st.guessed.indexOf(st.word[j2])<0) all=false;
      ok(all,'partida '+i+': todas las letras de la palabra adivinadas');
    }else if(st.result==='lose'){
      losses++;
      ok(isLost(st),'partida '+i+': isLost');
      eq(st.wrong,LIVES,'partida '+i+': derrota con exactamente 7 fallos');
    }else{
      ok(false,'partida '+i+': sin resultado pese a terminar');
    }
  }
  console.log('INFO simulación: '+wins+' victorias · '+losses+' derrotas');
  eq(wins+losses,10,'10 partidas con resultado');
  ok(wins>=1,'hay al menos una victoria simulada');
  ok(losses>=1,'hay al menos una derrota simulada');

  /* ---------- resumen ---------- */
  for(var gi=0;gi<groups.length;gi++){
    var g2=groups[gi];
    console.log((g2.f?'FAIL':'OK  ')+' '+g2.n+' · '+g2.t+' comprobaciones'+(g2.f?' · '+g2.f+' fallos':''));
  }
  console.log('---');
  console.log('AHORCADO TESTS · '+t+' comprobaciones · '+f+' fallos · '+(f?'FAIL':'PASS'));
  if(typeof process!=='undefined'&&process&&process.exitCode!==undefined&&f) process.exitCode=1;
};
if (typeof document === 'undefined') runTests();
</script>
</body>
</html>
