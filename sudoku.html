<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14471c">
<title>Sudoku</title>
<style>
:root{
  --cell:#f3eddd;
  --given-bg:#e3dcc4;
  --line:#c9c1a8;
  --line-thick:#5d5647;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(ellipse at top,#2f7d3a,#14471c 72%);
  color:#eaf5ea;
  display:flex;flex-direction:column;
  min-height:100vh;
}
.top{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:9px 14px;background:rgba(0,0,0,.3);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.12);position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
a.btn{text-decoration:none}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.4px}
.brand .grid-ico{font-size:20px;line-height:1}
.stats{display:flex;gap:9px;font-variant-numeric:tabular-nums}
.stat{background:rgba(0,0,0,.3);padding:4px 11px;border-radius:8px;min-width:66px;text-align:center}
.stat span{display:block;font-size:9.5px;opacity:.72;text-transform:uppercase;letter-spacing:.7px}
.stat b{font-size:15px;font-weight:650}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{
  font:inherit;font-size:13px;background:#37474f;color:#fff;border:1px solid rgba(255,255,255,.22);
  padding:7px 12px;border-radius:8px;cursor:pointer;
}
.btn:hover{background:#455a64}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{background:#37474f}
select.btn{background:#263238;padding:7px 8px}
.btn.on{background:#2e7d32;border-color:rgba(255,255,255,.45)}
.btn.on:hover{background:#388e3c}

main.play{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:13px;padding:16px 12px 10px;
}
#board{
  display:grid;grid-template-columns:repeat(9,1fr);
  width:min(94vw,470px,62vh);aspect-ratio:1/1;
  background:var(--cell);border:3px solid var(--line-thick);border-radius:6px;
  overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.cell{
  display:grid;place-items:center;position:relative;
  background:var(--cell);color:#0d3c78;font-weight:500;
  font-size:clamp(15px,5vw,30px);line-height:1;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+73){border-bottom:0}
.cell.bR{border-right:2.5px solid var(--line-thick)}
.cell.bB{border-bottom:2.5px solid var(--line-thick)}
.cell:focus{outline:none}
.cell:focus-visible{outline:2px solid #40c4ff;outline-offset:-2px}
.cell.given{background:var(--given-bg);color:#1b5e20;font-weight:700}
.cell.peer{background:#e6e3c7}
.cell.same{background:#ffef9e}
.cell.sel{background:#ffd54f;box-shadow:inset 0 0 0 3px #ef6c00}
.cell.wrong{background:#f6c9c7;color:#c62828}
.cell.hinted{animation:hintcell .5s ease-in-out infinite alternate}
@keyframes hintcell{
  from{box-shadow:inset 0 0 0 2px #40c4ff}
  to{box-shadow:inset 0 0 0 5px #ffee58}
}
.cell .nv{display:block;pointer-events:none}
.cell .notes{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:100%;height:100%;padding:7%;gap:2%;
  font-size:clamp(7px,3vw,13px);font-weight:600;color:#5f6f8f;pointer-events:none;
}
.cell .notes i{font-style:normal;display:grid;place-items:center}
@supports (font-size:1cqw){
  #board{container-type:inline-size}
  .cell{font-size:6.4cqw}
  .cell .notes{font-size:clamp(7px,2.7cqw,13px)}
}

#pad{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;padding:2px 10px}
.pad-btn{
  font:inherit;width:46px;height:46px;padding:0;font-size:19px;font-weight:650;
  background:#37474f;color:#fff;border:1px solid rgba(255,255,255,.22);
  border-radius:9px;cursor:pointer;display:grid;place-items:center;
}
.pad-btn:hover{background:#455a64}
.pad-btn:active{transform:translateY(1px)}
.pad-btn:focus-visible{outline:2px solid #40c4ff;outline-offset:2px}
.pad-btn.wide{width:auto;padding:0 15px;font-size:14px;font-weight:600}
.pad-btn.on{background:#2e7d32;border-color:rgba(255,255,255,.45)}
.pad-btn.on:hover{background:#388e3c}

.hint-bar{padding:0 14px 10px;font-size:12px;opacity:.6;text-align:center}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);
  background:rgba(0,0,0,.88);border:1px solid rgba(255,255,255,.15);
  padding:9px 17px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
  transition:.25s;z-index:60;
}
#toast.show{opacity:1;transform:translateX(-50%)}
#win{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:70}
#win.show{display:grid}
.winbox{
  background:#17351b;border:1px solid rgba(255,255,255,.2);border-radius:14px;
  padding:28px 34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6);max-width:90vw;
}
.winbox h2{margin:0 0 8px;font-size:26px}
.winbox p{margin:6px 0 18px;opacity:.85;font-variant-numeric:tabular-nums}

@media (max-width:760px){
  .top{gap:7px;padding:8px 10px}
  .brand h1{font-size:15px}
  .stat{min-width:56px;padding:3px 8px}
  main.play{padding:12px 8px 8px;gap:10px}
  .tools{gap:6px}
  .btn{font-size:12.5px;padding:6px 10px}
  .hint-bar{padding:0 10px 8px;font-size:11.5px}
}
@media (max-width:600px){
  #board{width:min(97vw,470px,62vh)}
  .pad-btn{width:44px;height:44px;font-size:18px}
  #pad{gap:5px}
  .stats{gap:6px}
  .stat b{font-size:14px}
}
@media (max-height:540px){
  .hint-bar{display:none}
  main.play{padding:8px 10px 6px;gap:8px}
  #board{width:min(94vw,470px,56vh)}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="index.html" title="Lista de juegos"><span class="grid-ico">▦</span><h1>Sudoku</h1></a>
  <div class="stats">
    <div class="stat"><span>Tiempo</span><b id="time">0:00</b></div>
    <div class="stat"><span>Errores</span><b id="errStat">0</b></div>
  </div>
  <div class="tools">
    <a class="btn" href="index.html" title="Volver a la lista de juegos">⌂ Juegos</a>
    <select class="btn" id="diffSel" title="Dificultad">
      <option value="1">Fácil</option>
      <option value="2">Medio</option>
      <option value="3">Difícil</option>
      <option value="4">Experto</option>
    </select>
    <button class="btn" id="btnNew">Nuevo juego</button>
    <button class="btn" id="btnUndo" disabled>Deshacer</button>
    <button class="btn" id="btnHint">Pista</button>
    <button class="btn" id="btnErr" aria-pressed="true">Errores: sí</button>
  </div>
</header>

<main class="play">
  <div id="board" role="grid" aria-label="Tablero de sudoku 9 por 9"></div>
  <div id="pad" role="group" aria-label="Teclado numérico">
    <button class="pad-btn" data-d="1" aria-label="Escribir 1">1</button>
    <button class="pad-btn" data-d="2" aria-label="Escribir 2">2</button>
    <button class="pad-btn" data-d="3" aria-label="Escribir 3">3</button>
    <button class="pad-btn" data-d="4" aria-label="Escribir 4">4</button>
    <button class="pad-btn" data-d="5" aria-label="Escribir 5">5</button>
    <button class="pad-btn" data-d="6" aria-label="Escribir 6">6</button>
    <button class="pad-btn" data-d="7" aria-label="Escribir 7">7</button>
    <button class="pad-btn" data-d="8" aria-label="Escribir 8">8</button>
    <button class="pad-btn" data-d="9" aria-label="Escribir 9">9</button>
    <button class="pad-btn" id="btnErase" title="Borrar (Retróceso)" aria-label="Borrar">⌫</button>
    <button class="pad-btn wide" id="btnNotes" title="Modo notas" aria-pressed="false">Notas</button>
  </div>
</main>

<div class="hint-bar">Toca una casilla y escribe con el teclado · Flechas mover · 1-9 escribir · ⌫ borrar · N nuevo · U deshacer · H pista</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="win" role="dialog" aria-modal="true" aria-label="Sudoku completado">
  <div class="winbox">
    <h2>¡Completado!</h2>
    <p id="winStats"></p>
    <button class="btn" id="btnAgain">Jugar otra vez</button>
  </div>
</div>

<script>
/* ================= MOTOR PURO (sin DOM) ================= */
var LEVEL_CLUES=[0,40,34,30,26];
var LEVEL_NAMES=['','Fácil','Medio','Difícil','Experto'];

function zeroGrid(){
  var a=new Array(81);
  for(var i=0;i<81;i++) a[i]=0;
  return a;
}
function emptyNotes(){
  var a=new Array(81);
  for(var i=0;i<81;i++) a[i]=[];
  return a;
}

var state={
  puzzle:zeroGrid(), solution:zeroGrid(), grid:zeroGrid(),
  notes:emptyNotes(), level:1, started:false, won:false,
  t0:0, wonAt:0, moves:0, hints:0
};

/* Fisher-Yates */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function isValid(grid,i,v){
  if(v<1||v>9) return false;
  var r=Math.floor(i/9), c=i%9;
  var br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(var k=0;k<9;k++){
    var rr=r*9+k;
    var cc=k*9+c;
    var bb=(br+Math.floor(k/3))*9+bc+(k%3);
    if(rr!==i && grid[rr]===v) return false;
    if(cc!==i && grid[cc]===v) return false;
    if(bb!==i && grid[bb]===v) return false;
  }
  return true;
}

function popcount(x){
  var c=0;
  while(x){ x&=x-1; c++; }
  return c;
}

var BITVAL=new Array(512);
for(var _bm=0;_bm<512;_bm++) BITVAL[_bm]=0;
for(var _bd=1;_bd<=9;_bd++) BITVAL[1<<(_bd-1)]=_bd;

/* Cuenta soluciones con backtracking + MRV + bits, corta en 2. */
function solveCount(grid){
  var rows=[0,0,0,0,0,0,0,0,0];
  var cols=[0,0,0,0,0,0,0,0,0];
  var boxes=[0,0,0,0,0,0,0,0,0];
  var empties=[];
  var i;
  for(i=0;i<81;i++){
    var gv=grid[i];
    if(gv===0){ empties.push(i); continue; }
    if(gv<1||gv>9) return 0;
    var gbit=1<<(gv-1);
    var gr=(i/9)|0, gc=i%9, gb=((gr/3)|0)*3+((gc/3)|0);
    if((rows[gr]|cols[gc]|boxes[gb])&gbit) return 0;
    rows[gr]|=gbit; cols[gc]|=gbit; boxes[gb]|=gbit;
  }
  if(!empties.length) return 1;

  var put=new Array(81);
  for(i=0;i<81;i++) put[i]=0;
  var stack=[];
  var count=0;

  function clearCell(idx){
    var v=put[idx];
    if(!v) return;
    var bit=1<<(v-1);
    var r=(idx/9)|0, c=idx%9, b=((r/3)|0)*3+((c/3)|0);
    rows[r]&=~bit; cols[c]&=~bit; boxes[b]&=~bit;
    put[idx]=0;
  }
  function propagate(){
    var changed=true;
    while(changed){
      changed=false;
      for(var k=0;k<empties.length;k++){
        var idx=empties[k];
        if(put[idx]) continue;
        var r=(idx/9)|0, c=idx%9, b=((r/3)|0)*3+((c/3)|0);
        var cand=(~(rows[r]|cols[c]|boxes[b]))&0x1FF;
        var cnt=popcount(cand);
        if(cnt===0) return false;
        if(cnt===1){
          rows[r]|=cand; cols[c]|=cand; boxes[b]|=cand;
          put[idx]=BITVAL[cand];
          stack.push(idx);
          changed=true;
        }
      }
    }
    return true;
  }
  function rec(){
    if(count>=2) return;
    var bi=-1, bc=0, bn=10;
    for(var k=0;k<empties.length;k++){
      var idx=empties[k];
      if(put[idx]) continue;
      var r=(idx/9)|0, c=idx%9, b=((r/3)|0)*3+((c/3)|0);
      var cand=(~(rows[r]|cols[c]|boxes[b]))&0x1FF;
      var cnt=popcount(cand);
      if(cnt===0) return;
      if(cnt<bn){ bn=cnt; bc=cand; bi=idx; if(cnt===1) break; }
    }
    if(bi<0){ count++; return; }
    var mark=stack.length;
    var r2=(bi/9)|0, c2=bi%9, b2=((r2/3)|0)*3+((c2/3)|0);
    while(bc && count<2){
      var low=bc&-bc;
      bc=bc&(bc-1);
      rows[r2]|=low; cols[c2]|=low; boxes[b2]|=low;
      put[bi]=BITVAL[low];
      stack.push(bi);
      if(propagate()) rec();
      while(stack.length>mark) clearCell(stack.pop());
    }
  }
  rec();
  return count;
}

function wrongCells(grid, solution){
  var out=[];
  for(var i=0;i<81;i++){
    if(grid[i]!==0 && grid[i]!==solution[i]) out.push(i);
  }
  return out;
}

function isComplete(grid){
  for(var i=0;i<81;i++){
    var v=grid[i];
    if(v<1||v>9) return false;
    if(!isValid(grid,i,v)) return false;
  }
  return true;
}

function fillGrid(g,i){
  if(i>=81) return true;
  var cands=[1,2,3,4,5,6,7,8,9];
  shuffle(cands);
  for(var k=0;k<9;k++){
    var v=cands[k];
    if(isValid(g,i,v)){
      g[i]=v;
      if(fillGrid(g,i+1)) return true;
      g[i]=0;
    }
  }
  return false;
}
function makeSolution(){
  var g=zeroGrid();
  fillGrid(g,0);
  return g;
}

/* Solución única, pistas ~40/34/30/26, simetría rotacional 180°. */
function generatePuzzle(level){
  level=Math.floor(Number(level));
  if(!(level>=1&&level<=4)) level=1;
  var target=LEVEL_CLUES[level];
  var best=null;
  for(var attempt=0;attempt<6;attempt++){
    var solution=makeSolution();
    var puzzle=solution.slice();
    var pairs=new Array(40);
    for(var p=0;p<40;p++) pairs[p]=p;
    shuffle(pairs);
    var clues=81;
    for(var k=0;k<pairs.length;k++){
      if(clues-2<target) break;
      var a=pairs[k], b=80-a;
      puzzle[a]=0; puzzle[b]=0;
      if(solveCount(puzzle)===1) clues-=2;
      else { puzzle[a]=solution[a]; puzzle[b]=solution[b]; }
    }
    if(clues-1>=target){
      puzzle[40]=0;
      if(solveCount(puzzle)===1) clues--;
      else puzzle[40]=solution[40];
    }
    if(!best || clues<best.clues) best={puzzle:puzzle,solution:solution,clues:clues};
    if(clues===target) break;
  }
  return {puzzle:best.puzzle, solution:best.solution};
}

function newState(level){
  var p=generatePuzzle(level);
  return {
    puzzle:p.puzzle, solution:p.solution, grid:p.puzzle.slice(),
    notes:emptyNotes(), level:level, started:false, won:false,
    t0:0, wonAt:0, moves:0, hints:0
  };
}

/* ================= UI (solo en navegador) ================= */
if (typeof document !== 'undefined') {

var $=function(s){return document.querySelector(s);};

function lsGet(k,d){
  try{
    if(typeof localStorage==='undefined') return d;
    var v=localStorage.getItem(k);
    return v===null?d:v;
  }catch(_){ return d; }
}
function lsSet(k,v){
  try{ if(typeof localStorage!=='undefined') localStorage.setItem(k,v); }catch(_){}
}

var diff=parseInt(lsGet('sudoku.diff','1'),10);
if(!(diff>=1&&diff<=4)) diff=1;
var showErrors=lsGet('sudoku.errors','1')!=='0';

var sel=-1;
var noteMode=false;
var undoStack=[];
var hintIdx=-1;
var hintTimer=null;
var toastTimer=null;
var cells=[];

function fmtTime(s){
  var m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0');
}
function elapsed(){
  if(!state.started) return 0;
  var end=(state.won&&state.wonAt)?state.wonAt:Date.now();
  return Math.floor((end-state.t0)/1000);
}
function isPeer(a,b){
  var ra=(a/9)|0, ca=a%9, rb=(b/9)|0, cb=b%9;
  if(ra===rb) return true;
  if(ca===cb) return true;
  if(((ra/3)|0)===((rb/3)|0) && ((ca/3)|0)===((cb/3)|0)) return true;
  return false;
}

function toast(msg){
  var t=$('#toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },2200);
}

function snapshot(){
  var ns=new Array(81);
  for(var i=0;i<81;i++) ns[i]=state.notes[i].slice();
  return {grid:state.grid.slice(), notes:ns, moves:state.moves};
}
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length>200) undoStack.shift();
}
function undo(){
  if(state.won) return;
  if(!undoStack.length){ toast('Nada que deshacer'); return; }
  var s=undoStack.pop();
  state.grid=s.grid;
  state.notes=s.notes;
  state.moves=s.moves;
  render();
}
function startClock(){
  if(!state.started){ state.started=true; state.t0=Date.now(); }
}

function setCell(i,v){
  if(state.won||state.puzzle[i]!==0) return;
  if(state.grid[i]===v) return;
  pushUndo();
  startClock();
  state.grid[i]=v;
  state.notes[i]=[];
  state.moves++;
  render();
  checkWin();
}
function erase(){
  if(state.won||sel<0) return;
  if(state.puzzle[sel]!==0) return;
  if(!state.grid[sel] && !state.notes[sel].length) return;
  pushUndo();
  startClock();
  state.grid[sel]=0;
  state.notes[sel]=[];
  state.moves++;
  render();
}
function toggleNote(i,d){
  if(state.won||state.puzzle[i]!==0||state.grid[i]!==0) return;
  var n=state.notes[i];
  var idx=n.indexOf(d);
  pushUndo();
  startClock();
  if(idx>=0) n.splice(idx,1);
  else { n.push(d); n.sort(function(a,b){return a-b;}); }
  state.moves++;
  render();
}
function inputDigit(d){
  if(state.won) return;
  if(sel<0){ toast('Toca una casilla primero'); return; }
  if(state.puzzle[sel]!==0){ toast('Casilla fija'); return; }
  if(noteMode) toggleNote(sel,d);
  else setCell(sel,d);
}
function toggleNotes(){
  noteMode=!noteMode;
  $('#btnNotes').classList.toggle('on',noteMode);
  $('#btnNotes').setAttribute('aria-pressed',noteMode?'true':'false');
}
function checkWin(){
  if(state.won) return;
  if(!isComplete(state.grid)) return;
  state.won=true;
  state.wonAt=Date.now();
  render();
}
function flashHint(){
  if(hintTimer) clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){ hintIdx=-1; render(); },1600);
}
function giveHint(){
  if(state.won) return;
  if(sel<0){ toast('Toca una casilla para la pista'); return; }
  if(state.puzzle[sel]!==0){ toast('Esa casilla ya está fija'); return; }
  if(state.grid[sel]===state.solution[sel] && !state.notes[sel].length){
    hintIdx=sel; render(); flashHint(); return;
  }
  pushUndo();
  startClock();
  state.grid[sel]=state.solution[sel];
  state.notes[sel]=[];
  state.moves++;
  state.hints++;
  hintIdx=sel;
  render();
  flashHint();
  checkWin();
}

function newGame(){
  if(hintTimer){ clearTimeout(hintTimer); hintTimer=null; }
  hintIdx=-1;
  noteMode=false;
  $('#btnNotes').classList.remove('on');
  $('#btnNotes').setAttribute('aria-pressed','false');
  sel=-1;
  undoStack=[];
  state=newState(diff);
  render();
}
function confirmNew(){
  if(state.started && !state.won){
    if(!confirm('¿Empezar una nueva partida? Se perderá la actual.')) return false;
  }
  return true;
}

function ariaFor(i){
  var r=((i/9)|0)+1, c=(i%9)+1;
  var v=state.grid[i];
  var s='Fila '+r+', columna '+c+', ';
  if(v){
    s+=(state.puzzle[i]!==0?'dada ':'')+v;
    if(showErrors && state.solution[i]!==v) s+=' (error)';
  }else{
    var n=state.notes[i];
    s+=n.length?('notas '+n.join(', ')):'vacía';
  }
  if(i===sel) s+=', seleccionada';
  return s;
}

function render(){
  var g=state.grid, sol=state.solution, pu=state.puzzle;
  var selVal=(sel>=0)?g[sel]:0;
  var wc=wrongCells(g,sol);
  var wrongSet=null;
  if(showErrors){
    wrongSet={};
    for(var w=0;w<wc.length;w++) wrongSet[wc[w]]=1;
  }
  for(var i=0;i<81;i++){
    var el=cells[i];
    var v=g[i];
    var cls='cell';
    if(pu[i]!==0) cls+=' given';
    if(sel>=0){
      if(i===sel) cls+=' sel';
      else if(isPeer(sel,i)) cls+=' peer';
      if(v&&selVal&&v===selVal) cls+=' same';
    }
    if(wrongSet && wrongSet[i]) cls+=' wrong';
    if(hintIdx===i) cls+=' hinted';
    el.className=cls;
    if(v){
      el.innerHTML='<span class="nv">'+v+'</span>';
    }else if(state.notes[i].length){
      var h='<span class="notes">';
      for(var d=1;d<=9;d++) h+='<i>'+(state.notes[i].indexOf(d)>=0?d:'')+'</i>';
      el.innerHTML=h+'</span>';
    }else{
      el.innerHTML='';
    }
    el.setAttribute('aria-label',ariaFor(i));
  }
  $('#time').textContent=fmtTime(elapsed());
  $('#errStat').textContent=showErrors?String(wc.length):'—';
  $('#btnUndo').disabled=undoStack.length===0;
  $('#btnErr').textContent='Errores: '+(showErrors?'sí':'no');
  $('#btnErr').classList.toggle('on',showErrors);
  $('#btnErr').setAttribute('aria-pressed',showErrors?'true':'false');
  $('#win').classList.toggle('show',!!state.won);
  if(state.won){
    $('#winStats').textContent='Tiempo: '+fmtTime(elapsed())+' · Dificultad: '+LEVEL_NAMES[state.level]+' · Pistas: '+state.hints;
  }
}

/* ---- montaje ---- */
var board=$('#board');
for(var ci=0;ci<81;ci++){
  var d=document.createElement('div');
  d.className='cell';
  d.dataset.i=ci;
  if((ci%9)===2||(ci%9)===5) d.classList.add('bR');
  var rw=(ci/9)|0;
  if(rw%3===2 && rw<8) d.classList.add('bB');
  d.setAttribute('role','gridcell');
  d.setAttribute('tabindex','-1');
  board.appendChild(d);
  cells.push(d);
}

board.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('.cell'):null;
  if(!t) return;
  sel=+t.dataset.i;
  render();
  try{ t.focus({preventScroll:true}); }catch(_){ try{ t.focus(); }catch(__){} }
});

$('#pad').addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('button'):null;
  if(!b) return;
  if(b.dataset.d){ inputDigit(parseInt(b.dataset.d,10)); return; }
  if(b.id==='btnErase'){ erase(); return; }
  if(b.id==='btnNotes'){ toggleNotes(); }
});

$('#btnUndo').addEventListener('click',undo);
$('#btnHint').addEventListener('click',giveHint);
$('#btnNew').addEventListener('click',function(){ if(confirmNew()) newGame(); });
$('#btnAgain').addEventListener('click',newGame);
$('#btnErr').addEventListener('click',function(){
  showErrors=!showErrors;
  lsSet('sudoku.errors',showErrors?'1':'0');
  render();
});
$('#diffSel').addEventListener('change',function(e){
  diff=parseInt(e.target.value,10);
  if(!(diff>=1&&diff<=4)) diff=1;
  lsSet('sudoku.diff',String(diff));
  newGame();
});

document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var k=e.key;
  if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){
    e.preventDefault();
    if(sel<0){ sel=0; render(); return; }
    var r=(sel/9)|0, c=sel%9;
    if(k==='ArrowUp') r=Math.max(0,r-1);
    else if(k==='ArrowDown') r=Math.min(8,r+1);
    else if(k==='ArrowLeft') c=Math.max(0,c-1);
    else c=Math.min(8,c+1);
    sel=r*9+c;
    render();
    return;
  }
  if(k>='1'&&k<='9'){ inputDigit(k.charCodeAt(0)-48); return; }
  if(k==='Backspace'||k==='Delete'){ e.preventDefault(); erase(); return; }
  var lk=k.toLowerCase();
  if(lk==='n'){ if(confirmNew()) newGame(); }
  else if(lk==='u'){ undo(); }
  else if(lk==='h'){ giveHint(); }
});

setInterval(function(){
  if(state.started && !state.won) $('#time').textContent=fmtTime(elapsed());
},500);

if(typeof window!=='undefined'){
  window.__sudoku={
    state:function(){ return state; },
    select:function(i){ sel=i; render(); },
    input:inputDigit,
    erase:erase,
    undo:undo,
    hint:giveHint,
    newGame:newGame,
    errors:function(){ return showErrors; },
    noteMode:function(){ return noteMode; }
  };
}

$('#diffSel').value=String(diff);
newGame();

}
</script>
</body>
</html>
